name: Test Python

on:
  pull_request:
    branches:
      - main
    paths:
      - packages/**
      - insight_agent/**
      - tests/**
      - requirements/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/test-python.yml
  push:
    branches:
      - main
    paths:
      - packages/**
      - insight_agent/**
      - tests/**
      - requirements/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/test-python.yml

concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: false

#permissions:
#  contents: read
#  pull-requests: write
#
jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    env:
      # The InsightAgent acceptance tests exercise the app/serve/ext source
      # packages directly.  Keeping these paths explicit avoids installing the
      # full optional workspace (and its heavyweight RAG/accelerator stack).
      PYTHONPATH: ${{ github.workspace }}/packages/dbgpt-app/src:${{ github.workspace }}/packages/dbgpt-serve/src:${{ github.workspace }}/packages/dbgpt-ext/src
    strategy:
      fail-fast: false
      matrix:
        # TODO: Add windows-latest support
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --package dbgpt \
            --extra client \
            --extra cli \
            --extra agent \
            --extra simple_framework \
            --extra framework \
            --extra code \
            --extra proxy_openai \
            --link-mode=copy \
            --frozen
          uv pip install --python .venv/bin/python \
            -r requirements/dev-requirements.txt \
            psycopg2-binary

      - name: Run InsightAgent acceptance tests
        run: |
          output_file="pytest_output-${{ matrix.python-version }}-${{ matrix.os }}.txt"
          set +e
          uv run --no-sync python -m pytest tests/insight_agent \
            --junitxml=pytest_report-${{ matrix.python-version }}-${{ matrix.os }}.xml \
            > "$output_file" 2>&1
          test_status=$?
          cat "$output_file"
          {
            echo "### InsightAgent acceptance-test output"
            echo '```text'
            tail -n 160 "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Generate test report summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          test_file="pytest_report-${{ matrix.python-version }}-${{ matrix.os }}.xml"
          total_tests=$(grep -oP 'tests="\K\d+' $test_file)
          failures=$(grep -oP 'failures="\K\d+' $test_file)
          skipped=$(grep -oP 'skipped="\K\d+' $test_file)
          test_summary="Total tests: $total_tests, Failures: $failures, Skipped: $skipped"
          echo "Test Summary: $test_summary"
          echo "::set-output name=summary::$test_summary"

# TODO: Add comment on PR
#      - name: Comment on PR
#        if: github.event_name == 'pull_request_target' && matrix.os == 'ubuntu-latest'
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#        run: |
#          PR_COMMENT="## Test Coverage and Report Summary\n${{ steps.cov-report.outputs.summary }}\n${{ steps.test-report.outputs.summary }}"
#          PR_COMMENTS_URL=$(jq -r .pull_request.comments_url < "$GITHUB_EVENT_PATH")
#          curl -s -S -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -X POST --data "{ \"body\": \"$PR_COMMENT\" }" "$PR_COMMENTS_URL"
#
      - name: Upload test and coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            pytest_report-${{ matrix.python-version }}-${{ matrix.os }}.xml
            pytest_output-${{ matrix.python-version }}-${{ matrix.os }}.txt
          if-no-files-found: ignore
